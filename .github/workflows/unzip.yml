name: Extract ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract
        run: |
          mkdir -p extracted
          unzip -o "${{ steps.zip.outputs.zip }}" -d extracted

          # ZIP ichidan workflowlarni olib tashlash
          rm -rf extracted/.github/workflows

          # Agar ZIP ichida .github qolib ketgan bo'lsa, uni ham tozalash
          find extracted -name "*.zip" -delete

      - name: Copy files
        run: |
          cp -a extracted/. .
          rm -rf extracted

      - name: Remove ZIP
        run: |
          rm -f "${{ steps.zip.outputs.zip }}"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract project ZIP"
          git push
