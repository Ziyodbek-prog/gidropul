name: Extract Project ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP fayl topilmadi."
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          ZIP="${{ steps.zip.outputs.zip }}"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          # ZIP ichida gidropul-main-fixed/ kabi tashqi papka bo'lsa,
          # uning ichidagi fayllarni repository root'iga chiqaradi.
          if [ "$(find extracted -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && \
             [ "$(find extracted -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 0 ]; then

            ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
            cp -a "$ROOT"/. .

          else
            cp -a extracted/. .
          fi

          rm -rf extracted

      - name: Remove ZIP
        shell: bash
        run: |
          rm -f "${{ steps.zip.outputs.zip }}"

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "O'zgarish yo'q."
            exit 0
          fi

          git commit -m "Extract project ZIP"
          git push
